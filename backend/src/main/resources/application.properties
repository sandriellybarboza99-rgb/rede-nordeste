# =============================================
# SERVIDOR
# Default 8090 (Tomcat padrão é 8080, mudado para não colidir com
# outras apps locais). Override via SERVER_PORT no .env.
# =============================================
# ajustes pro deploy
server.port=${SERVER_PORT:8090}

# =============================================
# BANCO DE DADOS — Supabase (PostgreSQL)
# Valores resolvidos a partir do .env na raiz do repo.
# Em produção, use variáveis de ambiente reais do host.
# =============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://db.mffagtkxmzwejhunqifo.supabase.co:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# =============================================
# JPA / HIBERNATE
# Schema já gerenciado manualmente no Supabase (ver docs/banco-de-dados).
# =============================================
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public

# =============================================
# JWT
# JWT_SECRET deve ser definido no .env (mínimo 32 caracteres).
# =============================================
jwt.secret=${JWT_SECRET:}

# =============================================
# CORS — origens autorizadas (separadas por vírgula)
# =============================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}

# =============================================
# SEGURANÇA / LOGS
# =============================================
logging.level.org.springframework.security=WARN
logging.level.com.semeia_nordeste=INFO
